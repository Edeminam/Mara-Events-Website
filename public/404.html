<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Page not found | Mara Events</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/favicon-32x32.png" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: 'Hanken Grotesk', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      color: #ffffff;
      background: #0d2257;
      text-align: center;
    }
    main { max-width: 520px; }
    img { max-width: 220px; height: auto; margin-bottom: 32px; }
    .code { font-size: 14px; font-weight: 700; letter-spacing: 0.2em; color: #9fc0f5; margin-bottom: 12px; }
    h1 { font-size: clamp(28px, 6vw, 40px); font-weight: 800; line-height: 1.15; margin-bottom: 16px; }
    p { font-size: 17px; line-height: 1.6; color: rgba(255, 255, 255, 0.82); margin-bottom: 32px; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
    a.btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 100px;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      color: #ffffff;
      background: #2174e9;
    }
    a.btn.secondary { background: transparent; border: 2px solid rgba(255, 255, 255, 0.5); }
    a.btn:focus-visible { outline: 3px solid #ffffff; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <img src="/images/Mara%20Event%20logo%20white.png" alt="Mara Events" width="268" height="88" />
    <p class="code">ERROR 404</p>
    <h1>We couldn&rsquo;t find that page</h1>
    <p>The link may be out of date or the page may have moved. Head back to the homepage or plan your event with us.</p>
    <div class="actions">
      <a class="btn" href="/">Back to homepage</a>
      <a class="btn secondary" href="/#book">Book your event</a>
    </div>
  </main>
</body>
</html>
